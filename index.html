<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>101 Okey Kuralları</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111111;
            color: white;
            text-align: center;
        }

        header {
            padding: 60px 20px 40px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #cccccc;
            font-size: 18px;
        }

        .sections {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 30px 20px;
            flex-wrap: wrap;
        }

        .card {
            background: #1d1d1d;
            border-radius: 20px;
            padding: 30px;
            width: 250px;
            cursor: pointer;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-8px);
            background: #292929;
        }

        .card h2 {
            font-size: 22px;
        }

        .card p {
            color: #bbbbbb;
        }

        footer {
            margin-top: 60px;
            padding: 20px;
            color: #777777;
        }
    </style>
</head>

<body>

    <header>
        <h1>101 OKEY KURALLARI</h1>
        <p>101 Okey'i öğrenmenin en kolay yolu.</p>
    </header>

    <main class="sections">

        <div class="card">
            <h2>🎮 Oyunun Kuralları</h2>
            <p>Oyunun temel kurallarını öğren.</p>
        </div>

        <div class="card">
            <h2>🀄 El Açma</h2>
            <p>El açma kurallarını öğren.</p>
        </div>

        <div class="card">
            <h2>📊 Puanlama</h2>
            <p>Puanların nasıl hesaplandığını öğren.</p>
        </div>

    </main>

    <footer>
        101 Okey Kuralları
    </footer>

</body>
</html>
